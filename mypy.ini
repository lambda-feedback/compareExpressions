[mypy]
python_version = 3.12
files = app
exclude = ^app/tests/
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# sympy, mpmath and latex2sympy2 ship without type information
[mypy-sympy.*]
ignore_missing_imports = True

[mypy-mpmath.*]
ignore_missing_imports = True

[mypy-latex2sympy2.*]
ignore_missing_imports = True

[mypy-latex2sympy2_extended.*]
ignore_missing_imports = True